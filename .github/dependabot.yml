# Keeps pinned references current. The Dockerfile pins its base image by digest and the workflows pin actions
# by version; without an updater those pins go stale and stop receiving security fixes.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-image:
        patterns: ["*"]
    # The base image tag (python 3.12) moves only by a deliberate change; digest refreshes of that tag still arrive.
    ignore:
      - dependency-name: "mcr.microsoft.com/azurelinux/base/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
