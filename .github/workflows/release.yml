name: Release

# Publishes a GitHub release for a version tag (vMAJOR.MINOR.PATCH). A release is the image that CD already built,
# scanned and deployed for that commit, not a new build, so what is released is what was tested.
#
# How to cut a release (docs/delivery.md, 'Releasing'):
#   1. A pull request bumps `version` in pyproject.toml and moves the CHANGELOG.md 'Unreleased' entries under
#      `## [X.Y.Z] - YYYY-MM-DD`. Merge it to main and let CD finish for that commit.
#   2. Push the tag:  git tag -a vX.Y.Z -m "FabricOps X.Y.Z" <merge commit> && git push origin vX.Y.Z
#
# `verify` checks the tag, the package version, the changelog and that the tagged commit is on main, then collects the
# image digest and SBOM from the CD run for that commit. `publish` proves the registry holds that digest under the
# commit tag (which CD sets only after the scan gate passed), adds the semver tag, and creates the release with the
# notes taken from CHANGELOG.md. It runs in the `dev` environment, whose OIDC subject already holds AcrPush on the
# registry; allow tags v*.*.* in that environment's deployment rules.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, changelog and build evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is a release version on main
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${TAG} points at ${GITHUB_SHA}, which is not on main. Releases are cut from main only."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Check the tag matches the package version
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "::error::Tag ${TAG} does not match version ${package_version} in pyproject.toml"
            exit 1
          fi

      - name: Build the release notes from CHANGELOG.md
        run: |
          python3 -I - "$VERSION" > release-notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, line in enumerate(lines) if re.match(rf"^## \[{re.escape(version)}\]", line)), None)
          if start is None:
              sys.exit(f"CHANGELOG.md has no '## [{version}]' section")
          body: list[str] = []
          for line in lines[start + 1 :]:
              if line.startswith("## [") or re.match(r"^\[[^\]]+\]:\s", line):
                  break
              body.append(line)
          notes = "\n".join(body).strip()
          if not notes:
              sys.exit(f"The '## [{version}]' section of CHANGELOG.md is empty")
          print(notes)
          PY
          echo "--- release notes ---"
          cat release-notes.md

      # The CD run for this exact commit built, scanned and pushed the image. Its artifacts are the release evidence.
      - name: Collect the image digest and SBOM from the CD run for this commit
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cd.yml --commit "$GITHUB_SHA" --event push \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No CD run found for ${GITHUB_SHA}. Merge the release pull request to main and wait for CD before tagging."
            exit 1
          fi
          echo "Using CD run ${run_id}"
          mkdir -p release-bundle
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name image-digest --name sbom --name trivy-report --dir release-bundle
          mv release-notes.md release-bundle/release-notes.md
          ls -la release-bundle
          image="$(cat release-bundle/image-digest.txt)"
          if [[ ! "$image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::release-bundle/image-digest.txt does not hold an image digest reference"
            exit 1
          fi

      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release-bundle
          retention-days: 7

  publish:
    name: Tag the image and publish the release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_REPOSITORY: ${{ vars.ACR_LOGIN_SERVER }}/orqentis-fabricops
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login
        run: az acr login --name "$ACR_NAME"

      # CD tags <sha> only after the scan gate passed, so the commit tag resolving to the recorded digest proves it.
      - name: Check the image passed the scan gate, then add the semver tag
        run: |
          version="${TAG#v}"
          recorded="$(cat release-bundle/image-digest.txt)"
          digest="${recorded##*@}"
          tagged="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ "$tagged" != "$digest" ]]; then
            echo "::error::${IMAGE_REPOSITORY}:${GITHUB_SHA} is '${tagged}', expected ${digest}. CD did not complete the scan gate for this build."
            exit 1
          fi
          existing="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${version}" --format '{{json .Manifest.Digest}}' 2> /dev/null | tr -d '"' || true)"
          if [[ -n "$existing" && "$existing" != "$digest" ]]; then
            echo "::error::${IMAGE_REPOSITORY}:${version} already points at ${existing}. Release tags are never moved."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            docker buildx imagetools create --tag "${IMAGE_REPOSITORY}:${version}" "${IMAGE_REPOSITORY}@${digest}"
          fi
          {
            echo
            echo "### Image"
            echo
            echo "\`${IMAGE_REPOSITORY}@${digest}\` (tags: \`${version}\`, \`${GITHUB_SHA}\`)"
            echo
            echo "The SBOM (SPDX) and the scan report for this exact image are attached."
          } >> release-bundle/release-notes.md

      - name: Create the GitHub release
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Orqentis FabricOps ${TAG#v}" \
            --notes-file release-bundle/release-notes.md \
            release-bundle/sbom.spdx.json release-bundle/image-digest.txt release-bundle/trivy-report.txt
