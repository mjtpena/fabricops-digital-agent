name: Deploy environment

# Called by cd.yml once per environment (dev, then test, then prod), so the three deployments run exactly the same
# steps. It deploys one image, by digest, into rg-fabricops-<environment> with infra/bicep/env/<environment>.bicepparam
# and then runs the smoke test. The GitHub environment named by `environment` supplies the approval gate (required
# reviewers on test and prod), the OIDC subject (<prefix>:environment:<environment>, see docs/delivery.md section 0) and the variables.
# Nothing here is a secret: client, tenant and subscription ids are identifiers, and Azure access is OIDC only.
#
# Environment variables (Settings > Environments > <environment> > Variables), see docs/delivery.md:
#   AZURE_CLIENT_ID      client id of this environment's deploy identity (fabricops-deploy-<environment>)
#   AZURE_RESOURCE_GROUP resource group to deploy into (rg-fabricops-<environment>)
#   ENTRA_API_CLIENT_ID  client id of this environment's "Orqentis FabricOps API" app registration
#   FABRIC_MODE          optional: overrides fabricMode for this environment ('mock' or 'rest')
#   POSTGRES_ENTRA_ADMIN_OBJECT_ID  object id of the Entra group (or user or service principal) that administers this
#                        environment's PostgreSQL server (identifier, not a secret)
#   POSTGRES_ENTRA_ADMIN_NAME       its name (for a group, the display name)
#   POSTGRES_ENTRA_ADMIN_TYPE       optional: Group (default), User or ServicePrincipal
#   POSTGRES_EXISTING_SERVER_NAME   optional: use this existing server (for example a restore) instead of creating one
#   EVIDENCE_IMMUTABILITY_LOCKED    'true' or 'false': whether the evidence immutability policy is Locked. REQUIRED in prod
#                        (an explicit decision: Locked is irreversible for the retention period and needs the owner's
#                        sign-off; the first deployment says 'false'), optional elsewhere (default 'false')
#   AUDIT_OPERATORS_OBJECT_ID       optional: object id of the Entra group of operators who may open an audit epoch after a
#                        restore (Storage Blob Data Contributor on the audit-epochs container only)
#   CONTAINER_APPS_SUBNET_ID, POSTGRES_DELEGATED_SUBNET_ID, POSTGRES_PRIVATE_DNS_ZONE_ID   test and prod only (required there):
#                        resource ids of the subnet that VNet-integrates the Container Apps environment, of the subnet delegated
#                        to PostgreSQL, and of the PostgreSQL private DNS zone (docs/delivery.md, "Private networking")
#   ALERT_ACTION_GROUP_ID optional: resource id of the action group the alerts notify, managed outside the pipeline
#                        (an identifier only; addresses and webhooks never go through a variable, see docs/operations.md)
#   SMOKE_HEALTH_AUTHENTICATED  optional: 'true' only if /health is NOT excluded from Container Apps authentication
#                        (anonymousHealthEndpoints = false); the default deployment excludes it
# Repository variables: AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_LOGIN_SERVER, ACR_RESOURCE_ID.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and deployment target (dev, test or prod).
        type: string
        required: true
      image:
        description: Image to deploy, by digest (<registry>/orqentis-fabricops@sha256:<digest>).
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    # One deployment per environment at a time; a queued deployment waits instead of cancelling a running one.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      CONTAINER_IMAGE: ${{ inputs.image }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_RESOURCE_ID: ${{ vars.ACR_RESOURCE_ID }}
      ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      # Read by the .bicepparam file. Identifiers come from GitHub variables, never from secrets.
      POSTGRES_ENTRA_ADMIN_OBJECT_ID: ${{ vars.POSTGRES_ENTRA_ADMIN_OBJECT_ID }}
      POSTGRES_ENTRA_ADMIN_NAME: ${{ vars.POSTGRES_ENTRA_ADMIN_NAME }}
      POSTGRES_EXISTING_SERVER_NAME: ${{ vars.POSTGRES_EXISTING_SERVER_NAME }}
      AUDIT_OPERATORS_OBJECT_ID: ${{ vars.AUDIT_OPERATORS_OBJECT_ID }}
      # Resource ids of the private network (identifiers, not secrets); test and prod read them, dev does not.
      CONTAINER_APPS_SUBNET_ID: ${{ vars.CONTAINER_APPS_SUBNET_ID }}
      POSTGRES_DELEGATED_SUBNET_ID: ${{ vars.POSTGRES_DELEGATED_SUBNET_ID }}
      POSTGRES_PRIVATE_DNS_ZONE_ID: ${{ vars.POSTGRES_PRIVATE_DNS_ZONE_ID }}
      # Read by infra/bicep/env/*.bicepparam. An identifier, not a receiver: empty means the template manages its own group.
      ALERT_ACTION_GROUP_ID: ${{ vars.ALERT_ACTION_GROUP_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # FABRIC_MODE and POSTGRES_ENTRA_ADMIN_TYPE are read by the .bicepparam files only when set; an empty value must
      # not shadow their default.
      - name: Check inputs and configuration
        env:
          FABRIC_MODE_VAR: ${{ vars.FABRIC_MODE }}
          POSTGRES_ENTRA_ADMIN_TYPE_VAR: ${{ vars.POSTGRES_ENTRA_ADMIN_TYPE }}
          EVIDENCE_IMMUTABILITY_LOCKED_VAR: ${{ vars.EVIDENCE_IMMUTABILITY_LOCKED }}
          AZURE_CLIENT_ID_VAR: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID_VAR: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID_VAR: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            dev | test | prod) ;;
            *) echo "::error::Unknown environment '${DEPLOY_ENVIRONMENT}' (expected dev, test or prod)"; exit 1 ;;
          esac
          [[ -f "infra/bicep/env/${DEPLOY_ENVIRONMENT}.bicepparam" ]] || { echo "::error::infra/bicep/env/${DEPLOY_ENVIRONMENT}.bicepparam is missing"; exit 1; }

          missing=()
          for name in AZURE_CLIENT_ID_VAR AZURE_TENANT_ID_VAR AZURE_SUBSCRIPTION_ID_VAR ACR_LOGIN_SERVER ACR_RESOURCE_ID ENTRA_API_CLIENT_ID RESOURCE_GROUP POSTGRES_ENTRA_ADMIN_OBJECT_ID POSTGRES_ENTRA_ADMIN_NAME; do
            [[ -n "${!name:-}" ]] || missing+=("${name%_VAR}")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub variables for environment '${DEPLOY_ENVIRONMENT}': ${missing[*]} (see docs/delivery.md)"
            exit 1
          fi

          # Only an image from our registry, by digest: never a tag, never another registry.
          if [[ ! "$CONTAINER_IMAGE" =~ ^${ACR_LOGIN_SERVER//./\\.}/orqentis-fabricops@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Image must be ${ACR_LOGIN_SERVER}/orqentis-fabricops@sha256:<64 hex digits>, got '${CONTAINER_IMAGE}'"
            exit 1
          fi

          # Outside dev the network is private (the template refuses a public PostgreSQL server there): the ids of the two
          # subnets and of the private DNS zone must be set, and must be resource ids.
          if [[ "$DEPLOY_ENVIRONMENT" != "dev" ]]; then
            for name in CONTAINER_APPS_SUBNET_ID POSTGRES_DELEGATED_SUBNET_ID POSTGRES_PRIVATE_DNS_ZONE_ID; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing GitHub variable for environment '${DEPLOY_ENVIRONMENT}': ${name} (private networking is required outside dev, docs/delivery.md)"
                exit 1
              fi
              if [[ ! "${!name}" =~ ^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.Network/ ]]; then
                echo "::error::${name} must be an Azure resource id under Microsoft.Network, got '${!name}'"
                exit 1
              fi
            done
          fi

          # The optional audit operators group is an Entra object id (a GUID) when it is set.
          if [[ -n "$AUDIT_OPERATORS_OBJECT_ID" && ! "$AUDIT_OPERATORS_OBJECT_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::AUDIT_OPERATORS_OBJECT_ID must be empty or the object id (a GUID) of the Entra group of audit operators"
            exit 1
          fi

          # The PostgreSQL administrator is an Entra object id (a GUID) and a name, never a credential.
          if [[ ! "$POSTGRES_ENTRA_ADMIN_OBJECT_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::POSTGRES_ENTRA_ADMIN_OBJECT_ID must be the object id (a GUID) of the Entra group, user or service principal that administers PostgreSQL"
            exit 1
          fi

          # Whether the evidence immutability policy is Locked: an explicit decision in prod (no default, because Locked is
          # irreversible for the retention period), optional elsewhere. Exported only when set, so an empty variable never
          # shadows the .bicepparam default; anything but true or false is refused.
          case "$EVIDENCE_IMMUTABILITY_LOCKED_VAR" in
            true | false) echo "EVIDENCE_IMMUTABILITY_LOCKED=${EVIDENCE_IMMUTABILITY_LOCKED_VAR}" >> "$GITHUB_ENV" ;;
            "")
              if [[ "$DEPLOY_ENVIRONMENT" == "prod" ]]; then
                echo "::error::EVIDENCE_IMMUTABILITY_LOCKED must be set to true or false on the prod environment: whether the evidence immutability policy is Locked is an explicit decision (docs/delivery.md, section 7)"
                exit 1
              fi
              ;;
            *) echo "::error::EVIDENCE_IMMUTABILITY_LOCKED must be true or false, got '${EVIDENCE_IMMUTABILITY_LOCKED_VAR}'"; exit 1 ;;
          esac

          if [[ -n "$FABRIC_MODE_VAR" ]]; then
            echo "FABRIC_MODE=${FABRIC_MODE_VAR}" >> "$GITHUB_ENV"
          fi
          if [[ -n "$POSTGRES_ENTRA_ADMIN_TYPE_VAR" ]]; then
            case "$POSTGRES_ENTRA_ADMIN_TYPE_VAR" in
              Group | User | ServicePrincipal) echo "POSTGRES_ENTRA_ADMIN_TYPE=${POSTGRES_ENTRA_ADMIN_TYPE_VAR}" >> "$GITHUB_ENV" ;;
              *) echo "::error::POSTGRES_ENTRA_ADMIN_TYPE must be Group, User or ServicePrincipal, got '${POSTGRES_ENTRA_ADMIN_TYPE_VAR}'"; exit 1 ;;
            esac
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check that the resource group exists
        run: |
          if [[ "$(az group exists --name "$RESOURCE_GROUP")" != "true" ]]; then
            echo "::error::Resource group '${RESOURCE_GROUP}' does not exist. Create it first (docs/delivery.md, 'Environment resource groups')."
            exit 1
          fi

      # What this deployment would change in the live resource group, recorded in the job summary and as an artifact. It
      # runs here, with this environment's own deploy identity, because ARM what-if performs the same authorization checks
      # as the deployment: an identity that can preview a deployment can effectively write, which is why no pull-request
      # identity runs it (the pull request shows an offline Bicep diff instead, bicep-diff.yml). The environment's approval
      # happens before any step of this job runs, so this is a record of the change, not a review gate. A failing preview
      # is reported but does not stop the deployment: the deployment validates the template itself.
      # Only paths and change types are published, never values: the template reads keys with listKeys() and a what-if
      # payload can contain them. The raw payload stays on the runner and is deleted.
      - name: What-if (record of the change)
        id: whatif
        continue-on-error: true
        run: |
          mkdir -p whatif-out
          raw="$RUNNER_TEMP/whatif-raw.json"
          trap 'rm -f "$raw"' EXIT
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "fabricops-whatif-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --parameters "infra/bicep/env/${DEPLOY_ENVIRONMENT}.bicepparam" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --output json > "$raw"
          python3 -I scripts/whatif_summary.py "$raw" "$DEPLOY_ENVIRONMENT" > "whatif-out/whatif-summary-${DEPLOY_ENVIRONMENT}.md"
          cat "whatif-out/whatif-summary-${DEPLOY_ENVIRONMENT}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: What-if did not complete
        if: steps.whatif.outcome == 'failure'
        run: |
          echo "::warning::The what-if preview for ${DEPLOY_ENVIRONMENT} failed (see the step log). The deployment continues; it validates the template itself."
          echo "### What-if for ${DEPLOY_ENVIRONMENT} did not complete (see the step log); deploying anyway" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the what-if summary
        if: steps.whatif.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bicep-whatif-${{ inputs.environment }}
          path: whatif-out/whatif-summary-${{ inputs.environment }}.md
          retention-days: 30

      - name: Deploy (az deployment group create)
        id: deploy
        run: |
          outputs="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "fabricops-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --parameters "infra/bicep/env/${DEPLOY_ENVIRONMENT}.bicepparam" \
            --query properties.outputs \
            --output json)"
          fqdn="$(printf '%s' "$outputs" | python3 -c 'import json, sys; print(json.load(sys.stdin)["containerAppFqdn"]["value"])')"
          app="$(printf '%s' "$outputs" | python3 -c 'import json, sys; print(json.load(sys.stdin)["containerAppName"]["value"])')"
          pg="$(printf '%s' "$outputs" | python3 -c 'import json, sys; print(json.load(sys.stdin)["postgresServerFqdn"]["value"])')"
          echo "fqdn=${fqdn}" >> "$GITHUB_OUTPUT"
          echo "app=${app}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed ${DEPLOY_ENVIRONMENT}"
            echo
            echo "* Commit: \`${GITHUB_SHA}\`"
            echo "* Image: \`${CONTAINER_IMAGE}\`"
            echo "* Endpoint: https://${fqdn}"
            echo "* PostgreSQL: \`${pg}\` (first deployment of an environment: run the bootstrap step, infra/bicep/README.md section 3a)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The federated token from the first login is short-lived and the deployment can take several minutes, so sign
      # in again for a fresh one before the smoke test requests an API token with the az CLI.
      - name: Azure login (OIDC, fresh token for the smoke test)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Smoke test
        env:
          SMOKE_BASE_URL: https://${{ steps.deploy.outputs.fqdn }}
          SMOKE_CONTAINER_APP: ${{ steps.deploy.outputs.app }}
          SMOKE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SMOKE_EXPECTED_IMAGE: ${{ inputs.image }}
          SMOKE_TOKEN_RESOURCE: api://${{ vars.ENTRA_API_CLIENT_ID }}
          SMOKE_HEALTH_AUTHENTICATED: ${{ vars.SMOKE_HEALTH_AUTHENTICATED || 'false' }}
        run: bash scripts/smoke-test.sh
