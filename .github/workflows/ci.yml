name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly: new advisories land without code changes, so rescan the dependencies and the image on a schedule.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned by full commit SHA with the version in a trailing comment; Dependabot keeps
# both current (.github/dependabot.yml). Runners are pinned to ubuntu-24.04 rather than ubuntu-latest.
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Lint and format check delivery scripts (ruff)
        run: |
          ruff check scripts
          ruff format --check scripts

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Validate runbooks
        run: python -m orqentis runbooks

      - name: Demo smoke test (mock estate, no credentials)
        run: python -m orqentis demo --no-report

      - name: Upload demo incident report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-incident-report-py${{ matrix.python-version }}
          path: var/demo/evidence/**/report.md
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The audited set is what the image ships (see the Dockerfile): the project plus its llm and azure-monitor
      # extras, resolved fresh. pip-audit is installed outside that environment so it does not audit itself.
      - name: Resolve the runtime dependency set
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install --quiet ".[llm,azure-monitor]"

      - name: Install pip-audit
        run: python -m pip install --quiet "pip-audit==2.10.1"

      - name: Audit (fails on anything not in .pip-audit-allowlist.toml)
        run: |
          site_packages="$("$RUNNER_TEMP/audit-venv/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          python scripts/pip_audit_gate.py --path "$site_packages"

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No third-party action: download the pinned release and verify its published SHA-256 before running it.
      # Bump version and checksum together (checksums are in actionlint_<version>_checksums.txt on the release).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  bicep:
    name: Bicep build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bicep
        run: az bicep install

      - name: Build main.bicep
        run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null

      - name: Build main.bicepparam
        run: az bicep build-params --file infra/bicep/main.bicepparam --stdout > /dev/null

      - name: Build every environment parameter file and check the prod write switch
        run: bash scripts/validate-bicep.sh

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (no push)
        run: docker build --pull -t orqentis-fabricops:ci .

      - name: Smoke test (/health)
        run: |
          docker run -d --name orqentis -p 8000:8000 orqentis-fabricops:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              docker rm -f orqentis > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs orqentis
          exit 1

      # Same policy as the CD gate: HIGH and CRITICAL findings that have a fix fail the build unless they are
      # accepted, with a justification and an expiry, in .trivyignore.yaml.
      - name: Scan image (Trivy, fails on unaccepted fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orqentis-fabricops:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          format: table
