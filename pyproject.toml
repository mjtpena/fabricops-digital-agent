[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "orqentis-fabricops"
version = "0.1.0"
description = "Orqentis FabricOps: an AI reliability engineer for Microsoft Fabric estates (MVP)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Orqentis" }]
keywords = ["microsoft-fabric", "sre", "aiops", "incident-management", "agent-framework"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "azure-identity>=1.19",
  "aiohttp>=3.9",  # async transport for azure-identity credentials
  "agent-framework-core>=1.21,<2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "rich>=13.7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# Azure OpenAI / OpenAI chat clients for the Agent Framework reasoner.
llm = ["agent-framework-openai>=1.16,<2"]
# Export OpenTelemetry traces/logs to Application Insights.
azure-monitor = ["azure-monitor-opentelemetry>=1.6"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "jsonschema>=4.23",  # tests: the committed contracts schema accepts and rejects what the model does
]

[project.scripts]
orqentis = "orqentis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orqentis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "security: critical security boundary tests",
  "scenario: end-to-end synthetic incident scenarios",
  "live: runs against the live FabricOps sandbox tenant; skipped unless ORQENTIS_LIVE_TESTS=1 (see tests/live)",
]
filterwarnings = ["ignore::DeprecationWarning:agent_framework.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]
ignore = [
  "S101",   # assert is fine in tests and invariants
  "RUF012", # pydantic/ClassVar false positives
  "PT018",  # composite assertions read better for domain checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"src/orqentis/api/routers/**" = ["B008"]  # FastAPI Query()/Depends() defaults
# Fabric notebook definitions run inside the Fabric Spark runtime, which injects the `spark` session global.
"scripts/live-estate/definitions/*.ipynb" = ["F821"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["orqentis"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["agent_framework_openai.*", "azure.monitor.*"]
ignore_missing_imports = true
